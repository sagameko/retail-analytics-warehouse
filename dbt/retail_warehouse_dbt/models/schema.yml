version: 2

models:
  - name: stg_sales
    description: Cleaned staging table for raw retail sales data.
    columns:
      - name: invoice_no
        tests:
          - not_null
      - name: invoice_date
        tests:
          - not_null
      - name: revenue
        tests:
          - not_null

  - name: dim_customer
    description: Customer dimension table.
    columns:
      - name: customer_key
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null

  - name: dim_product
    description: Product dimension table.
    columns:
      - name: product_key
        tests:
          - not_null
          - unique
      - name: product_code
        tests:
          - not_null

  - name: dim_country
    description: Country dimension table.
    columns:
      - name: country_key
        tests:
          - not_null
          - unique
      - name: country
        tests:
          - not_null

  - name: dim_date
    description: Date dimension table.
    columns:
      - name: date_key
        tests:
          - not_null
          - unique
      - name: full_date
        tests:
          - not_null

  - name: fact_sales
    description: Sales fact table connected to customer, product, country, and date dimensions.
    columns:
      - name: invoice_no
        tests:
          - not_null
      - name: date_key
        tests:
          - not_null
      - name: customer_key
        tests:
          - not_null
      - name: product_key
        tests:
          - not_null
      - name: country_key
        tests:
          - not_null
      - name: revenue
        tests:
          - not_null